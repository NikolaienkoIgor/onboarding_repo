site_name: Onboarding Hub
site_description: Your guide to getting started
site_author: Engineering Team
site_url: https://nikolaienkoigor.github.io/onboarding_repo/
docs_dir: docs
repo_url: https://github.com/NikolaienkoIgor/onboarding_repo
repo_name: NikolaienkoIgor/onboarding_repo

theme:
  name: material
  favicon: assets/no8box_logo.jpg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes

nav:
  - Development:
    - Process: development/process.md
    - Task: development/task.md
    - Tools: development/tools.md
    - Python Basics: development/python-basics.md

extra:
  generator: false

copyright: Copyright &copy; 2026
