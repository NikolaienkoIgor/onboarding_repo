site_name: Onboarding Hub
site_description: Your guide to getting started
site_author: Engineering Team
site_url: https://nikolaienkoigor.github.io/onboarding_repo/
docs_dir: docs
repo_url: https://github.com/NikolaienkoIgor/onboarding_repo
repo_name: NikolaienkoIgor/onboarding_repo

theme:
  name: material
  favicon: assets/no8box_logo.jpg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes

nav:
  - Basic Concepts:
    - Python Basics: development/python-basics.md
    - Dev Process: development/process.md
    - Structured Output: development/structured-output.md
    - Pydantic: development/pydantic.md
    - Regex: development/regex-pattern.md
  - Tool Stack:
    - Tools: development/tools.md
  - Trial Task:
    - Task: development/task.md
  - E-Invoicing:
    - What Is an Invoice?: e-invoicing/what-is-an-invoice.md
    - Why E-Invoicing?: e-invoicing/why-e-invoicing.md
    - EN 16931, The Standard Behind Every Format: e-invoicing/en-16931.md
    - E-Invoice Formats: e-invoicing/e-invoice-formats.md
    - What Is Peppol?: e-invoicing/what-is-peppol.md
    - Inside an E-Invoice, ZUGFeRD: e-invoicing/zugferd.md
    - Schematron Validation: e-invoicing/schematron-validation.md
    - Summary & Glossary: e-invoicing/summary-glossary.md
    - Generative Engine Optimization: development/basics-concepts.md
  - GCP:
    - Installation & Authentication: gcp/installation-authentication.md
    - Docker Image: gcp/docker-image.md

extra:
  generator: false

copyright: Copyright &copy; 2026
